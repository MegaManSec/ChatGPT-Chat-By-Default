name: Build & Publish (Chrome, Firefox, Safari macOS + iOS)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  XCODE_APP: /Applications/Xcode_27.2.app

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for changes outside the docs
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE" "$GITHUB_SHA" | tee changed.txt
          if grep -v -E '^(.*\.md|assets/.*|LICENSE)$' changed.txt | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs changed; skipping the build jobs."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.gate.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for a version bump
        id: gate
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          version="$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released."
          else
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Typecheck, lint, format
        run: pnpm run prebuild

      - name: Build and package Chrome
        run: pnpm run build:chrome && pnpm run package:chrome

      - name: Keep the Chrome zip for the Chrome Web Store job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-zip
          path: artifacts/chrome/chat-by-default-chrome.zip
          if-no-files-found: error
          retention-days: 1

      - name: Build and lint Firefox
        run: pnpm run build:firefox && pnpm run lint:firefox

  safari:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: xcode-27
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP" && xcodebuild -version

      - uses: ./.github/actions/setup

      - name: Build Safari extension resources
        run: pnpm run build:safari

      - name: Compile macOS app (unsigned)
        working-directory: safari/Chat by Default
        run: >
          xcodebuild -project "Chat by Default.xcodeproj" -scheme "Chat by Default (macOS)"
          -configuration Release -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO build

      - name: Compile iOS app for simulator (unsigned)
        working-directory: safari/Chat by Default
        run: >
          xcodebuild -project "Chat by Default.xcodeproj" -scheme "Chat by Default (iOS)"
          -configuration Release -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

  release:
    needs: [version, build, safari]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build and package Chrome
        run: pnpm run build:chrome && pnpm run package:chrome

      - name: Build Firefox and sign it as a self-distributed (unlisted) add-on
        if: vars.AMO_LISTED != 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          : "${WEB_EXT_API_KEY:?AMO_JWT_ISSUER is not set}" "${WEB_EXT_API_SECRET:?AMO_JWT_SECRET is not set}"
          pnpm run build:firefox && pnpm run sign:firefox

      - name: Attest Chrome zip
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/chrome/chat-by-default-chrome.zip

      - name: Attest Firefox xpi
        if: vars.AMO_LISTED != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/firefox/chat-by-default-firefox.xpi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          draft: true
          tag_name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            artifacts/chrome/chat-by-default-chrome.zip
            ${{ vars.AMO_LISTED != 'true' && 'artifacts/firefox/chat-by-default-firefox.xpi' || '' }}

  chrome-web-store:
    needs: [version, build, safari]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download the Chrome zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chrome-zip

      - name: Authenticate to Google Cloud
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false

      - name: Upload and publish to Chrome Web Store
        env:
          TOKEN: ${{ steps.google.outputs.access_token }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          : "${TOKEN:?no access token}" "${PUBLISHER_ID:?CWS_PUBLISHER_ID is not set}" "${EXTENSION_ID:?CWS_EXTENSION_ID is not set}"
          api="https://chromewebstore.googleapis.com"
          item="publishers/$PUBLISHER_ID/items/$EXTENSION_ID"
          show() { printf '%s\n' "${1//"$TOKEN"/***}"; }
          call() {
            local out
            if ! out=$(curl -sS --fail-with-body -H @<(printf 'Authorization: Bearer %s\n' "$TOKEN") "$@"); then
              show "$out" >&2
              return 1
            fi
            printf '%s' "$out"
          }

          response=$(call -X POST -T chat-by-default-chrome.zip "$api/upload/v2/$item:upload")
          state=$(jq -r .uploadState <<<"$response")
          for _ in $(seq 60); do
            [ "$state" = IN_PROGRESS ] || break
            sleep 5
            response=$(call "$api/v2/$item:fetchStatus")
            state=$(jq -r .lastAsyncUploadState <<<"$response")
          done
          if [ "$state" != SUCCEEDED ]; then
            echo "Upload ended as $state:"
            show "$response"
            exit 1
          fi

          response=$(call -X POST -H "Content-Type: application/json" -d '{"publishType":"DEFAULT_PUBLISH"}' "$api/v2/$item:publish")
          show "$response"
          [ "$(jq -r .state <<<"$response")" != REJECTED ]

  firefox-amo:
    needs: [version, release]
    if: needs.version.outputs.version != '' && vars.AMO_LISTED == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build Firefox
        run: pnpm run build:firefox

      - name: Submit listed version to addons.mozilla.org
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -o pipefail
          : "${WEB_EXT_API_KEY:?AMO_JWT_ISSUER is not set}" "${WEB_EXT_API_SECRET:?AMO_JWT_SECRET is not set}"
          pnpm run package:source
          if ! pnpm run publish:firefox 2>&1 | tee "$RUNNER_TEMP/web-ext.log"; then
            grep -q 'Approval: timeout exceeded' "$RUNNER_TEMP/web-ext.log" || exit 1
            echo "::warning::Mozilla didn't sign it within 30 minutes, so the GitHub Release gets an unsigned xpi."
          fi

      - name: Pick the signed xpi, or an unsigned one if Mozilla hasn't signed it yet
        id: xpi
        run: |
          signed=$(ls artifacts/firefox/*.xpi 2>/dev/null | head -n 1)
          if [ -n "$signed" ]; then
            file=artifacts/firefox/chat-by-default-firefox.xpi
            mv "$signed" "$file"
          else
            file=artifacts/firefox/chat-by-default-firefox.unsigned.xpi
            (cd dist/firefox && zip -qr "../../$file" .)
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Attest the xpi
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.xpi.outputs.file }}

      - name: Attach the xpi to the draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          FILE: ${{ steps.xpi.outputs.file }}
        run: gh release upload "v$VERSION" "$FILE" --clobber

  apple-testflight:
    needs: [version, build, safari]
    if: needs.version.outputs.version != ''
    runs-on: xcode-27
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP" && xcodebuild -version

      - uses: ./.github/actions/setup

      - name: Build Safari extension resources
        run: pnpm run build:safari

      - name: Archive and upload iOS and macOS apps to App Store Connect
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          : "${ASC_KEY_ID:?ASC_KEY_ID is not set}" "${ASC_KEY_P8:?ASC_KEY_P8 is not set}"
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          scripts/release-safari.sh app-store

  macos-notarized:
    needs: [version, release]
    if: needs.version.outputs.version != ''
    runs-on: xcode-27
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP" && xcodebuild -version

      - uses: ./.github/actions/setup

      - name: Build Safari extension resources
        run: pnpm run build:safari

      - name: Archive with Developer ID, notarize, staple
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          : "${ASC_KEY_ID:?ASC_KEY_ID is not set}" "${ASC_KEY_P8:?ASC_KEY_P8 is not set}"
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          scripts/release-safari.sh developer-id

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/safari/chat-by-default-macos.zip

      - name: Attach notarized macOS app to the draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release upload "v$VERSION" artifacts/safari/chat-by-default-macos.zip --clobber

  publish:
    needs: [version, release, macos-notarized, firefox-amo]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release edit "v$VERSION" --draft=false --latest
