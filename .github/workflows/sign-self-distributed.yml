name: Sign a self-distributed Firefox xpi (one-off)

on:
  push:
    branches: [ci/sign-self-distributed]

permissions: {}

jobs:
  sign:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build Firefox
        env:
          BUILD: '1'
        run: |
          [[ "$BUILD" =~ ^[0-9]+$ ]] || { echo "::error::build must be a number"; exit 1; }
          pnpm run build:firefox
          version="$(node -p 'require("./package.json").version').$BUILD"
          jq --arg v "$version" '.version = $v' dist/firefox/manifest.json > "$RUNNER_TEMP/manifest.json"
          mv "$RUNNER_TEMP/manifest.json" dist/firefox/manifest.json
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Sign it on addons.mozilla.org
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          : "${WEB_EXT_API_KEY:?AMO_JWT_ISSUER is not set}" "${WEB_EXT_API_SECRET:?AMO_JWT_SECRET is not set}"
          pnpm run package:source
          pnpm exec web-ext sign --source-dir=dist/firefox --artifacts-dir=artifacts/firefox \
            --channel=unlisted --upload-source-code=artifacts/firefox/source.zip --approval-timeout=1800000
          mv artifacts/firefox/*.xpi "artifacts/firefox/chat-by-default-firefox-$VERSION.xpi"

      - name: Attest the xpi
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/firefox/chat-by-default-firefox-${{ env.VERSION }}.xpi

      - name: Upload the xpi
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chat-by-default-firefox-${{ env.VERSION }}
          path: artifacts/firefox/chat-by-default-firefox-${{ env.VERSION }}.xpi
          if-no-files-found: error
