<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat by Default</title>
    <style>
      body {
        font:
          14px/1.4 -apple-system,
          system-ui,
          sans-serif;
        margin: 0;
        padding: 14px 16px;
        min-width: 240px;
        max-width: 320px;
        color: #1d1d1f;
        background: #fff;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #f5f5f7;
          background: #1c1c1e;
        }
      }
      h1 {
        font-size: 15px;
        margin: 0 0 6px;
      }
      p {
        margin: 0 0 10px;
      }
      button {
        font: inherit;
        padding: 6px 12px;
        border-radius: 8px;
        border: 0;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Chat by Default</h1>
    <p>Switches chatgpt.com to Chat whenever it opens on Work.</p>
    <p id="status"></p>
    <button id="open">Open chatgpt.com</button>
    <script src="popup.js"></script>
  </body>
</html>
